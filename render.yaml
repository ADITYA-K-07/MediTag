services:
  - type: web
    name: meditag-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MEDITAG_ADMIN_TOKEN
        sync: false
      - key: MEDITAG_CLINICIAN_TOKEN
        sync: false
      - key: MEDITAG_PRIVATE_KEY_BASE64
        sync: false
