name: meditag_reader
description: Offline-verifying NFC medical ID reader for MediTag.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  # 4.1.1 is the newest line compatible with the locally installed Dart 3.11.1.
  nfc_manager: ^4.1.1
  nfc_manager_ndef: ^1.1.0
  pointycastle: ^4.0.0
  http: ^1.2.2
  phosphor_flutter: ^2.1.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
