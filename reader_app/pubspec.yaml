name: meditag_reader
description: Offline-verifying NFC medical ID reader for MediTag.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  # 4.1.1 is the newest line compatible with the locally installed Dart 3.11.1.
  nfc_manager: ^4.1.1
  nfc_manager_ndef: ^1.1.0
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
